spring.application.name=clinica-piedra-azul
server.port=${SERVER_PORT:8080}

# Conexión a MySQL 8. La contraseña NO va en este archivo.
# Se toma de la variable de entorno DB_PASSWORD o de application-local.properties.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinica_piedra_azul?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=10000

# Hibernate crea y ajusta las tablas a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# El secreto del JWT no va en este archivo. Se define en application-local.properties
# o en la variable JWT_SECRET. La expiración por defecto es de 2 horas.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
# Se indica el dialecto para que una contraseña incorrecta no termine en el
# error "Unable to determine Dialect". Con conexión válida, Hibernate puede
# detectarlo; esta línea se puede retirar cuando MySQL ya esté configurado.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Origen del frontend Angular. Varios orígenes se separan con coma.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Este import va al final para que el archivo local pueda sobrescribir
# usuario, contraseña o URL sin modificar el código versionado.
spring.config.import=optional:file:./application-local.properties
